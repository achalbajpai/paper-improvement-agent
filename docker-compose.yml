



services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: answerthis
      POSTGRES_PASSWORD: answerthis
      POSTGRES_DB: answerthis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U answerthis -d answerthis"]
      interval: 5s
      timeout: 5s
      retries: 20

  grobid:

    image: grobid/grobid:0.9.0-crf
    ports:
      - "8070:8070"


    mem_limit: 6g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8070/api/isalive || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://answerthis:answerthis@postgres:5432/answerthis
      GROBID_URL: http://grobid:8070
      DATA_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/srv
      - ./data:/data
      - ./evals:/evals
      - ./docs:/docs
      - ./README.md:/repo/README.md:ro
      - ./.env.example:/repo/.env.example:ro
      - ./web/lib/api/openapi.json:/repo/web/lib/api/openapi.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      grobid:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build:
      context: ./web
    environment:


      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      API_URL: http://api:8000

      CI: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./web:/srv


      - web_deps:/srv/node_modules
      - web_build:/srv/.next
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  web_deps:
  web_build:
